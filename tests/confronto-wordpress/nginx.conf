# Confronto con Nginx regolato: WordPress senza cache (8201), WordPress con cache di pagina (8202), Presstatic (8204)
fastcgi_cache_path /var/cache/nginx/wp levels=1:2 keys_zone=WP:50m inactive=60m max_size=512m;
server {
    listen 8201;
    server_name wp.local;
    gzip on; gzip_vary on; gzip_types text/css application/javascript application/json application/xml;
    brotli on; brotli_types text/css application/javascript application/json application/xml;
    root /var/www/wp;
    index index.php;
    keepalive_requests 100000;
    server_tokens off;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
}
server {
    listen 8202;
    server_name wp.local;
    gzip on; gzip_vary on; gzip_types text/css application/javascript application/json application/xml;
    brotli on; brotli_types text/css application/javascript application/json application/xml;
    root /var/www/wp;
    index index.php;
    keepalive_requests 100000;
    server_tokens off;
    tcp_nopush off;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_cache WP;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 60m;
        fastcgi_cache_use_stale updating error timeout;
        fastcgi_cache_lock on;
        fastcgi_buffers 16 16k; fastcgi_buffer_size 32k;
        add_header X-Cache $upstream_cache_status;
    }
}
server {
    listen 8204;
    server_name www.presstatic.local;
    root /tmp/bench-ps/public;
    index index.html;
    include /etc/nginx/snippets/presstatic-statico.conf;
    open_file_cache max=50000 inactive=60s;


    location / { try_files $uri/index.html $uri =404; add_header Cache-Control "public, max-age=60" always; add_header X-Content-Type-Options nosniff always; }
}
