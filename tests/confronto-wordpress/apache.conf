<VirtualHost *:8203>
    ServerName wp.local
    DocumentRoot /var/www/wp
    # brotli se il browser lo accetta, altrimenti gzip (mod_brotli e mod_deflate)
    AddOutputFilterByType BROTLI_COMPRESS;DEFLATE text/html text/plain text/css application/javascript application/json application/xml
    <Directory /var/www/wp>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:8205>
    ServerName www.presstatic.local
    DocumentRoot /tmp/bench-ps/public
    DirectoryIndex index.html
    ErrorDocument 404 /404.html

    <Directory /tmp/bench-ps/public>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted

        RewriteEngine On
        # brotli se il browser lo accetta e la versione .br esiste, altrimenti gzip; senza nessuna delle due, compressione al volo
        RewriteCond %{HTTP:Accept-Encoding} \bbr\b
        RewriteCond %{REQUEST_FILENAME}.br -s
        RewriteRule ^(.+)$ $1.br [L,E=no-gzip:1,E=no-brotli:1]
        RewriteCond %{HTTP:Accept-Encoding} \bgzip\b
        RewriteCond %{REQUEST_FILENAME}.gz -s
        RewriteRule ^(.+)$ $1.gz [L,E=no-gzip:1,E=no-brotli:1]
    </Directory>

    # index.html.br resta una pagina HTML: il tipo viene da .html, la codifica da .br o .gz
    RemoveType .gz .br
    AddEncoding gzip .gz
    AddEncoding br .br
    <FilesMatch "\.(html|xml|txt|css|js|json|svg)(\.br|\.gz)?$">
        Header append Vary Accept-Encoding
    </FilesMatch>

    # Registro delle visite spento: dietro Cloudflare vede solo le pagine non ancora in cache
    CustomLog /dev/null common
</VirtualHost>

