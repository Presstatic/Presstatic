# Pannello Presstatic con Apache (richiede mod_proxy, mod_proxy_http, mod_headers, mod_ssl, mod_remoteip).
<VirtualHost *:443>
    ServerName admin.miosito.it
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare-origin.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare-origin.key

    LimitRequestBody 26214400
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    RequestHeader set X-Forwarded-Proto "https"
    # Dietro Cloudflare: l'indirizzo reale del visitatore (serve ai limiti sui tentativi di accesso).
    # Richiede mod_remoteip (a2enmod remoteip); accetta CF-Connecting-IP solo dalla rete di Cloudflare.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
