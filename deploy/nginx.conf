# Presstatic con Nginx. Sostituisci miosito.it con il tuo dominio.
# Certificati: con Cloudflare usa un "Origin Certificate" gratuito (SSL/TLS > Origin Server).

# 1) Sito pubblico: Nginx serve direttamente i file HTML generati. Presstatic non è coinvolto.
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.miosito.it;
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;

    root /var/www/presstatic/public;
    index index.html;
    absolute_redirect off;              # redirect relativi: restano in https dietro Cloudflare

    sendfile on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 30s;
    # Presstatic salva accanto a ogni pagina la versione gzip (.gz) e brotli (.br): Nginx le invia così come sono,
    # senza comprimere a ogni richiesta. brotli_static richiede il modulo libnginx-mod-http-brotli-static.
    gzip_static on;
    gzip_vary on;
    brotli_static on;
    # gzip normale solo per i file che non hanno una versione già compressa (per esempio quelli del file manager)
    gzip on;
    gzip_types application/xml application/rss+xml text/plain text/css;
    # Registro delle visite scritto a blocchi (ogni 64 KB o ogni 5 secondi) invece che riga per riga.
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    add_header X-Content-Type-Options nosniff always;
    # Strict-Transport-Security: dopo la prima visita, il browser usa solo HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # V6 — Accetta traffico SOLO da Cloudflare, così l'IP del server non è aggirabile.
    # Opzione A (consigliata): Authenticated Origin Pulls. Scarica il certificato di Cloudflare e attiva:
    #   ssl_client_certificate /etc/ssl/cloudflare-origin-pull-ca.pem;
    #   ssl_verify_client on;
    # Opzione B: limita agli IP di Cloudflare (aggiorna l'elenco da https://www.cloudflare.com/ips/):
    #   include /etc/nginx/cloudflare-allow.conf;   # righe "allow <rete>;" seguite da "deny all;"

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60" always;   # browser: 1 minuto
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;           # pagina 404 del tema, con le ultime notizie

    location /assets/ {                 # font dei temi: il nome contiene la versione
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Commenti, newsletter e notifiche: dal dominio del sito al programma. Così il pannello (admin.) può restare chiuso.
    # Richiede nel contesto http:  limit_req_zone $binary_remote_addr zone=presstatic_moduli:10m rate=30r/m;
    location ~ ^/(commenti|newsletter|push|modulo)/ {
        limit_req zone=presstatic_moduli burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /admin { return 404; }   # il pannello non è su questo dominio
}

# Senza www: reindirizza.
server {
    listen 80;
    listen 443 ssl http2;
    server_name miosito.it;
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;
    return 301 https://www.miosito.it$request_uri;
}

# 2) Pannello di amministrazione: dominio separato, solo HTTPS, inoltrato a Presstatic.
server {
    listen 443 ssl http2;
    server_name admin.miosito.it;
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;

    client_max_body_size 25m;           # caricamento immagini
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Facoltativo ma consigliato: solo gli IP della redazione.
    # allow 203.0.113.10;
    # deny all;

    # Dietro Cloudflare: l'indirizzo reale del visitatore, accettato solo dagli indirizzi di Cloudflare.
    set_real_ip_from 173.245.48.0/20; set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22; set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18; set_real_ip_from 190.93.240.0/20; set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17; set_real_ip_from 162.158.0.0/15; set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14; set_real_ip_from 172.64.0.0/13; set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32; set_real_ip_from 2606:4700::/32; set_real_ip_from 2803:f800::/32; set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32; set_real_ip_from 2a06:98c0::/29; set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;        # "Rigenera il sito" su archivi molto grandi
    }
}
