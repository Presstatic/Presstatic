# Sito pubblico di Presstatic con Apache (moduli: rewrite, headers, mime, deflate).
# Presstatic salva accanto a ogni pagina la versione brotli (.br) e gzip (.gz): queste regole le inviano così come sono
# ai browser che le accettano, senza comprimere la pagina a ogni visita. Sostituisci miosito.it e il percorso.
<VirtualHost *:80>
    ServerName www.miosito.it
    DocumentRoot /var/www/presstatic/public
    DirectoryIndex index.html
    ErrorDocument 404 /404.html

    <Directory /var/www/presstatic/public>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted

        RewriteEngine On
        # brotli se il browser lo accetta e la versione .br esiste, altrimenti gzip; senza nessuna delle due, compressione al volo
        RewriteCond %{HTTP:Accept-Encoding} \bbr\b
        RewriteCond %{REQUEST_FILENAME}.br -s
        RewriteRule ^(.+)$ $1.br [L,E=no-gzip:1,E=no-brotli:1]
        RewriteCond %{HTTP:Accept-Encoding} \bgzip\b
        RewriteCond %{REQUEST_FILENAME}.gz -s
        RewriteRule ^(.+)$ $1.gz [L,E=no-gzip:1,E=no-brotli:1]
    </Directory>

    # index.html.br resta una pagina HTML: il tipo viene da .html, la codifica da .br o .gz
    RemoveType .gz .br
    AddEncoding gzip .gz
    AddEncoding br .br
    <FilesMatch "\.(html|xml|txt|css|js|json|svg)(\.br|\.gz)?$">
        Header append Vary Accept-Encoding
    </FilesMatch>

    # Registro delle visite spento: dietro Cloudflare vede solo le pagine non ancora in cache
    CustomLog /dev/null common

    # Commenti, newsletter e notifiche: dal dominio del sito al programma (a2enmod proxy proxy_http).
    # Così il pannello (admin.) può restare chiuso alla redazione.
    ProxyPreserveHost On
    ProxyPassMatch "^/(commenti|newsletter|push|modulo)/(.*)$" "http://127.0.0.1:8080/$1/$2"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
</VirtualHost>
